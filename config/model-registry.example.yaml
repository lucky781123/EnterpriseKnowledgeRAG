schema_version: 1

# 公开模板：只记录能力、角色和非敏感运行时信息，不保存任何密钥。
providers:
  local_lmstudio:
    type: openai_compatible
    base_url: http://127.0.0.1:1234
    enabled: true
    roles: [answer]
    model: replace-with-local-model
    credential_env: LOCAL_LLM_API_KEY

  ollama:
    type: ollama_http
    base_url: http://127.0.0.1:11434
    enabled: true
    roles: [embedding]
    embedding_model: replace-with-embedding-model

  in_process_bge_reranker:
    type: python_in_process
    enabled: false
    roles: [reranker]
    implementation: enterprise_rag.reranking.bge.BGEReranker
    adapter: enterprise_rag.reranking.adapters.SyncRerankerAdapter

  online_provider:
    type: openai_compatible
    enabled: false
    roles: [evaluation_sample]
    base_url: https://example.invalid/v1
    model: replace-with-online-model
    credential_env: ONLINE_PROVIDER_API_KEY
