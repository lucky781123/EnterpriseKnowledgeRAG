# 本地LLM、Embedding、Reranker统一配置：修改后stop/start，启动时读取。
# model 必须与 LM Studio API 中的模型 ID 完全一致；不会自动下载或加载模型。
model = "qwen3-coder-next-reap-48b-a3b-mlx"

# LM Studio 的 OpenAI-compatible 服务地址；可以填写根地址或 /v1。
base_url = "http://127.0.0.1:1234"

# 并发生成和等待队列上限，避免同时提交大量请求。
max_concurrency = 2
max_queue_size = 8

# 本地 Embedding：模型更换后必须按实际输出维度建立新的 Dense profile。
# 已上传文档需回填；命令见README中的“模型与索引”，不会删除旧索引。
[embedding]
base_url = "http://127.0.0.1:11434"
model = "feadxus/qwen3-embedding:4b"
dimension = 2560

# 本地 HTTP Reranker：服务契约为 POST /v1/rerank。
[reranker]
base_url = "http://127.0.0.1:8003"
model = "jina-reranker-v3-mlx"

# 不在此文件填写密钥。需要时使用 .env 中的 LOCAL_LLM_API_KEY。
