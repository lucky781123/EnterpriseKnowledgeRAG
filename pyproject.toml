[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-rag"
version = "0.1.0"
description = "面向研发文档的企业级 RAG 学习与验证项目"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "EnterpriseKnowledgeRAG contributors" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "PyPDF2>=3,<4",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
infrastructure = [
  "redis>=5,<7",
  "celery[redis]>=5.5,<6",
  "boto3>=1.35,<2",
]
dev = [
  "jsonschema>=4.23,<5",
  "markdown-it-py>=4,<5",
  "Pygments>=2.18,<3",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
  "aiosqlite>=0.20,<1",
]
workbench = [
  "gradio>=5,<7",
]
reranker = [
  "torch>=2.2",
  "transformers>=4.40",
  "safetensors>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
