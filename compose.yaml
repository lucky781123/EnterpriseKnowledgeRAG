services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      ONLINE_LLM_ENABLED: "false"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
