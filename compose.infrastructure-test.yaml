# 仅用于隔离合成数据测试，不继承现有 Compose、.env 或业务 volume。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: infra_test
      POSTGRES_PASSWORD: isolated_test_only
      POSTGRES_DB: infra_test
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra_test -d infra_test"]
      interval: 2s
      retries: 30
    tmpfs: ["/var/lib/postgresql/data"]
  redis-cache:
    image: redis:7.4
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports: ["127.0.0.1::6379"]
  redis-coordination:
    image: redis:7.4
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["127.0.0.1::6379"]
    tmpfs: ["/data"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: isolated_test
      MINIO_ROOT_PASSWORD: isolated_test_only
    command: ["server", "/data"]
    ports: ["127.0.0.1::9000"]
    tmpfs: ["/data"]
  weaviate:
    image: semitechnologies/weaviate:1.27.10
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      AUTOSCHEMA_ENABLED: "false"
      ENABLE_MODULES: backup-filesystem
      BACKUP_FILESYSTEM_PATH: /backups
      CLUSTER_HOSTNAME: isolated-infra-test
    ports: ["127.0.0.1::8080"]
    tmpfs: ["/var/lib/weaviate", "/backups"]
